name: SEWT — Validation de la branche

on:
  push:
    branches: [recovery/sewt-original]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Install, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm typecheck
      - name: Contact API tests
        run: pnpm test:contact
      - name: Next.js production build
        run: pnpm build

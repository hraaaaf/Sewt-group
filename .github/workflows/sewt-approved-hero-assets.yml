name: SEWT approved hotel hero — embed original-motion master
on:
  push:
    branches:
      - feat/sewt-approved-hero-hotel-20261026
    paths:
      - .github/workflows/sewt-approved-hero-assets.yml
permissions:
  contents: write
jobs:
  commit-verified-hero:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout user-approved branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download exact approved video into first-party static assets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 60 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3Hr7zuByNIFoArCjlA8t5T2exht/5b8a2861-77ed-4b9c-b6dc-6f9ecb9e691c.mp4' \
            --output public/brand/hotel-riad-taroudant-hero.mp4
          echo '2784d02afff163668940152ec30dc209fe32c278c233cb2efd0c4587b9349894  public/brand/hotel-riad-taroudant-hero.mp4' | sha256sum -c -
          test "$(wc -c < public/brand/hotel-riad-taroudant-hero.mp4)" -eq 1952877
          test "$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 public/brand/hotel-riad-taroudant-hero.mp4)" = '10.000000'
      - name: Derive aligned hotel first-frame poster
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -nostdin -v error -y -ss 0.35 -i public/brand/hotel-riad-taroudant-hero.mp4 -frames:v 1 -c:v libwebp -quality 82 public/brand/hotel-riad-taroudant-poster.webp
          test -s public/brand/hotel-riad-taroudant-poster.webp
      - name: Commit exactly two first-party media replacements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SEWT CI'
          git config user.email 'sewt-ci@users.noreply.github.com'
          git add -- public/brand/hotel-riad-taroudant-hero.mp4 public/brand/hotel-riad-taroudant-poster.webp
          if ! git diff --cached --quiet; then
            git commit -m 'asset(hero): embed approved original-motion Riad Taroudant 10s video'
            git push origin HEAD:feat/sewt-approved-hero-hotel-20261026
          fi
